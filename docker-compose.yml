services:
  ti_fixer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ti-fixer:latest
    container_name: ti_fixer
    working_dir: /app

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      TZ: America/Mexico_City
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
      - ./logs:/app/logs

    restart: unless-stopped